<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="css/style.css">
 
</head>
<body>
       <header>
    <h1>Finanly</h1>
    <p>Seu controle financeiro pessoal</p>
</header>

<main>
    <section id="resumo">
       <h2>Resumo financeiro</h2>

    <div class="campo-resumo">
        <label for="entrada">Total de entradas</label>
        <input type="text" id="entrada"
               value="R$ 0,00" readonly>
    </div>

    <div class="campo-resumo">
        <label for="saida">Total de saídas</label>
        <input type="text" id="saida"
               value="R$ 0,00" readonly>
    </div>

    <div class="campo-resumo">
        <label for="entradaSaida">Saldo atual</label>
        <input type="text" id="entradaSaida"
               value="R$ 0,00" readonly>
    </div> 
    </section>

    <section id="novaMovimentacao">
        <h2>Nova movimentação</h2>

        <p>O que deseja registrar?</p>

        <label>
            <input type="radio" name="tipoRegistro"
                   value="entrada" required>
            Dinheiro de entrada
        </label>

        <label>
            <input type="radio" name="tipoRegistro"
                   value="saida">
            Dinheiro de saída
        </label>

        <label for="descricao">Descrição</label>
        <input type="text" id="descricao"
               placeholder="Ex.: Salário, aluguel..."
               required>

        <label for="categoria">Categoria</label>
        <select id="categoria" required>
            <option value="">Selecione uma categoria</option>
            <option value="servicos">Serviços/trabalho</option>
            <option value="salario">Salário/renda fixa</option>
            <option value="moradia">Moradia/contas</option>
            <option value="alimentacao">Alimentação</option>
            <option value="outros">Outros</option>
        </select>

        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor"
               min="0.01" step="0.01"
               placeholder="Ex.: 100,00" required>

        <label for="data">Data</label>
        <input type="date" id="data" required>

        <button type="button" id="btnSalvar">
            Salvar movimentação
        </button>
    </section>

    <section id="historico">
        <h2>Histórico de movimentações</h2>

        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Tipo</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="tabelaMovimentacoes">
            </tbody>
        </table>
    </section>
</main>


       <script src="js/script.js" defer></script>
</body>
</html>
